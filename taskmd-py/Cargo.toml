[package]
name = "taskmd-py"
version = "1.0.0-rc2"
edition = "2021"
description = "PyO3 Python extension for taskmd-core"
license = "MIT"
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
taskmd-core = { path = "../taskmd-core" }
pyo3 = { version = "0.28", features = ["extension-module"] }
