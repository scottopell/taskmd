[package]
name = "taskmd-core"
version = "1.0.0-rc1"
edition = "2021"
description = "Core logic for taskmd — Markdown-native task management"
license = "MIT"

# Pure Rust library — no PyO3 dependency.
[lib]
name = "taskmd_core"

[dependencies]
gethostname = "1"
sha2       = "0.10"
regex      = "1"

[dev-dependencies]
proptest  = "1"
tempfile  = "3"
